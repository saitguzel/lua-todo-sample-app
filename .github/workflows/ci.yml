name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
    inputs:
      bench: { type: boolean, default: false, description: "Yük testini de koş" }

# Lua araçları (luacheck, busted, resty, argon2) dev api imajında: Makefile hedefleri TOOLS_IMAGE ile koşar.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build api
      - run: make lint

  shared-unit:
    runs-on: ubuntu-latest
    strategy:
      matrix: { lua: ["luajit-openresty", "5.4"] }   # 00 §11 teknik düzeltme #2
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v10
        with: { luaVersion: "${{ matrix.lua }}" }
      - uses: leafo/gh-actions-luarocks@v4
      - run: luarocks install busted
      - run: busted shared/spec

  api-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build api
      - run: make test.api

  web-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v10
        with: { luaVersion: "5.4" }
      - uses: leafo/gh-actions-luarocks@v4
      - run: luarocks install busted
      - run: cd web && busted spec

  hadolint:
    runs-on: ubuntu-latest
    strategy:
      matrix: { dockerfile: [api/Dockerfile, web/Dockerfile] }
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with: { dockerfile: "${{ matrix.dockerfile }}" }

  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  integration:
    runs-on: ubuntu-latest
    needs: [lint, shared-unit, api-unit]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && echo "APP_ENV=test" >> .env && echo "SEED_DEFAULTS=true" >> .env
      - run: docker compose up -d --build --wait postgres mailhog api
      - run: make db.migrate db.seed
      - run: make test.integration
      - if: failure()
        run: docker compose logs api postgres

  spec-lint:
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait postgres api
      - run: curl -sf http://localhost:28080/api/v1/swagger.json -o swagger.json
      - run: npx --yes @redocly/cli@1 lint swagger.json --config redocly.yaml   # teknik düzeltme #10

  web-e2e:
    runs-on: ubuntu-latest
    needs: [integration, web-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: cp .env.example .env && echo "SEED_DEFAULTS=true" >> .env
      - run: cd web && npm ci && npx playwright install --with-deps && ./build-wasm.sh
      - run: make up.e2e
      - run: make db.migrate db.seed
      - run: cd web && npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: web/playwright-report }

  bench:
    if: github.event_name == 'workflow_dispatch' && inputs.bench
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y wrk jq
      - run: cp .env.example .env && echo "SEED_DEFAULTS=true" >> .env
      - run: docker compose up -d --build --wait && make db.migrate db.seed
      - run: make bench
      - uses: actions/upload-artifact@v4
        with: { name: bench-results, path: api/bench/results }
