<!doctype html>
<!-- ŞABLON: build-wasm.sh bu dosyadan public/index.html üretir (yer tutucular hash'li adlarla değişir).
     public/index.html'i elle düzenlemeyin. -->
<html lang="tr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>Todo</title>
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'wasm-unsafe-eval' __CSP_SCRIPT_EXTRA__;
    style-src 'self' 'unsafe-inline';
    connect-src 'self' __CSP_CONNECT_EXTRA__;
    worker-src 'self' blob:;
    img-src 'self' data:;
    font-src 'self';
    object-src 'none'; base-uri 'none'; form-action 'none'">
  <link rel="preload" href="./__WASM__" as="fetch" type="application/wasm" crossorigin>
  <link rel="preload" href="./__BUNDLE__" as="fetch" crossorigin>
  <link rel="modulepreload" href="./__GLUE__">
  <!-- Tema FOUC önleme + API config: inline değil ayrı dosya (CSP, F12 kararı (b)) -->
  <script src="./__BOOT__"></script>
  __TAILWIND__
  <link rel="stylesheet" href="./__STYLES__">
  <script type="module" src="./__GLUE__"></script>
</head>
<body class="min-h-screen bg-[var(--bg)] text-[var(--fg)]">
  <a href="#main" class="skip-link">İçeriğe atla</a>
  <!-- Canlı bölgeler baştan boş olarak DOM'da (sonradan eklenen live region duyurulmaz — F16) -->
  <div id="toast-root">
    <div id="toast-polite" class="toast-region" aria-live="polite" aria-relevant="additions"></div>
    <div id="toast-assertive" class="toast-region" role="alert" aria-live="assertive"></div>
  </div>
  <div id="modal-root"></div>
  <div id="app">
    <!-- Statik uygulama kabuğu: WASM yüklenirken boş ekran yerine iskelet (F17 #10, LCP) -->
    <div id="boot" class="boot-shell" aria-busy="true">
      <div class="boot-bar"></div>
      <div class="boot">Yükleniyor…</div>
    </div>
  </div>
  <noscript>Bu uygulama JavaScript ve WebAssembly gerektirir.</noscript>
</body>
</html>
