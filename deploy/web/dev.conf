# Dev web: statik build + /api/ → api konteyneri (aynı origin). Uygulama hangi IP/hostname ile açılırsa
# açılsın API'ye aynı adresten gider; CORS gerekmez. Prod'da bu işi deploy/proxy/nginx.conf yapar.
server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;

  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 1 MiB sınırını API uygulasın (JSON 413); proxy daha geniş
    client_max_body_size 2m;
  }

  location = /index.html { add_header Cache-Control "no-cache"; }
  location / { try_files $uri /index.html; }
}
