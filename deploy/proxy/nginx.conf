worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events { worker_connections 2048; }

http {
  server_tokens off;
  log_format json escape=json '{"req_id":"$request_id","method":"$request_method",'
    '"path":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
    '"duration_ms":$request_time,"ip":"$remote_addr"}';
  access_log /dev/stdout json;

  # Rate limit (API koruması)
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

  # Gzip statik (build-wasm.sh .gz üretir)
  gzip_static on;
  gzip on;
  gzip_types application/json application/wasm text/css application/javascript;

  upstream api { server api:8080; keepalive 32; }
  upstream web { server web:80; }

  # HTTP → HTTPS yönlendirme
  server {
    listen 80;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP: F12 politikası — wasm-unsafe-eval zorunlu; unsafe-eval ve script 'unsafe-inline' YOK.
    # style-src 'unsafe-inline' bilinçli istisna: view'lar dinamik genişlik için style attribute yazar
    # (skeleton, dashboard barları). Script çalıştırmaz; kaldırmak için dom.lua CSSOM'a geçmeli
    # (docs/security-checklist.md).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    client_max_body_size 1m; # PAYLOAD_TOO_LARGE ile uyumlu (00 §5)

    location /api/ {
      limit_req zone=api burst=40 nodelay;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header Host $host;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_pass http://api;
    }

    # metrics yalnızca iç ağdan (Prometheus backend ağından)
    location = /api/v1/metrics { deny all; }

    # Swagger UI kendi CSP'sini (jsDelivr) API'den gönderir; genel CSP burada devralınmaz.
    # (location içinde add_header varsa server seviyesindekiler devralınmaz → gerekli olanlar tekrar)
    location /api/v1/swagger {
      # auth_basic "API docs"; auth_basic_user_file /etc/nginx/certs/htpasswd;  # prod'da kapatmak için
      add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      add_header X-Frame-Options DENY always;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header Host $host;
      proxy_pass http://api;
    }

    location / {
      proxy_pass http://web;
      proxy_set_header Host $host;
    }
  }
}
